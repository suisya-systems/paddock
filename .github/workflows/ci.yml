name: CI
on: [push, pull_request]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the link checker
        run: bash tests/check-links.test.sh
      - name: Check relative Markdown links
        run: bash scripts/check-links.sh
  templates-and-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run every test (tests/*.test.sh, with stubbed hc and other commands)
        # One glob step: a new tests/<name>.test.sh runs without touching this file.
        run: |
          set -e
          for t in tests/*.test.sh; do echo "== $t"; bash "$t"; done
      - name: Check every template header
        run: bash scripts/check-templates.sh
      - name: Probe scripts parse (no hook script tests exist yet)
        # There are no hook scripts or tests under scripts/ or templates/ yet,
        # so this runs the sh -n syntax check over the probe scripts instead.
        run: |
          set -e
          for f in scripts/probes/*.sh; do echo "sh -n $f"; sh -n "$f"; done
      - name: Check the mod without herdr-app
        # Skipped: `herdr-app check` needs a display (the docs do not say it runs
        # headless, and we do not guess). Replaced by: mod.json parses and
        # main.js passes node --check. See docs/design/predecessor-inventory.md HK-17.
        run: |
          set -e
          for d in mods/*/; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "${d}mod.json"
            node --check "${d}main.js"
            echo "ok $d"
          done
  acceptance:
    # Replaces the acceptance gate (Q11 decided (d)). Branch protection makes this job a
    # required status check on main; see docs/design/acceptance-check.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Declared tests fail at the test commit, pass at head, stay unchanged
        # The checker is taken from the base, so a PR cannot change the rules it is judged by.
        # The PR's own copy is used only while the base has none (the PR that adds it).
        run: |
          base=${{ github.event.pull_request.base.sha }}
          git show "$base:scripts/acceptance-check.sh" > "$RUNNER_TEMP/acceptance-check.sh" 2>/dev/null \
            || cp scripts/acceptance-check.sh "$RUNNER_TEMP/acceptance-check.sh"
          bash "$RUNNER_TEMP/acceptance-check.sh" "$base" "${{ github.event.pull_request.head.sha }}"
